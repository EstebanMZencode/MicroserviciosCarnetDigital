name: app_usr
description: "Aplicación móvil de usuario — Carnet Digital CUC"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0
  # Lectura del archivo .env en tiempo de ejecución
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # El .env debe estar declarado como asset para poder leerlo con dotenv
    - .env
